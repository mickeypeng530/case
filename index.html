            });
            
            // 手機週切換按鈕
            document.getElementById('prev-week-btn')?.addEventListener('click', (e) => {
                e.preventDefault();
                state.mobileWeekIndex--;
                const totalWeeks = document.querySelectorAll('.week-container').length;
                updateMobileWeekView(totalWeeks);
            });
            document.getElementById('next-week-btn')?.addEventListener('click', (e) => {
                e.preventDefault();
                state.mobileWeekIndex++;
                const totalWeeks = document.querySelectorAll('.week-container').length;
                updateMobileWeekView(totalWeeks);
            });
            
            // 手機滑動切換週
            let touchStartX = 0;
            let touchEndX = 0;
            const tabContent = document.getElementById('tab-content');
            
            tabContent.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            tabContent.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                const totalWeeks = document.querySelectorAll('.week-container').length;
                
                // 滑動距離超過 50px 才觸發
                if (Math.abs(diff) > 50) {
                    if (diff > 0 && state.mobileWeekIndex < totalWeeks - 1) {
                        // 往左滑 → 下一週
                        state.mobileWeekIndex++;
                        updateMobileWeekView(totalWeeks);
                    } else if (diff < 0 && state.mobileWeekIndex > 0) {
                        // 往右滑 → 上一週
                        state.mobileWeekIndex--;
                        updateMobileWeekView(totalWeeks);
                    }
                }
            }, { passive: true });
            
            // 同步按鈕（手動重新載入）
            document.getElementById('sync-btn').addEventListener('click', async () => {
                if (firebaseReady && fbDb) {
                    showStatus('同步中...', true);
                    const snapshot = await get(ref(fbDb, 'scheduler'));
                    const data = snapshot.val();
                    if (data) {
                        state.tabs = data.tabs || [];
                        state.activeTabId = data.activeTabId || (state.tabs[0]?.id || null);
                        state.cellData = data.cellData || {};
                        const _idsAdded = ensureCaseIds();
                        saveToLocalStorage();
                        if (_idsAdded) saveToStorage();
                        renderTabs();
                        renderTabContent();
                    }
                    showStatus('已同步', false);
                } else {
                    alert('Firebase 尚未連線');
                }
            });

            // Tab clicks
            document.getElementById('tabs-container').addEventListener('click', (e) => {
                const closeBtn = e.target.closest('.close-tab');
                const oldTabClose = e.target.closest('.old-tab-close');
                const oldTabItem = e.target.closest('.old-tab-item');
                const oldTabsBtn = e.target.closest('.old-tabs-btn');
                const tab = e.target.closest('.tab:not(.old-tabs-btn)');
                
                // 舊分頁下拉選單按鈕
                if (oldTabsBtn) {
                    e.stopPropagation();
                    const dropdown = document.getElementById('old-tabs-dropdown');
                    const overlay = document.getElementById('old-tabs-overlay');
                    if (dropdown) {
                        const isShowing = dropdown.classList.contains('show');
                        if (isShowing) {
                            dropdown.classList.remove('show');
                            overlay?.classList.remove('show');
                        } else {
                            dropdown.classList.add('show');   // 先 show 才量得到 offsetWidth
                            positionOldTabsDropdown(oldTabsBtn);
                            overlay?.classList.add('show');
                        }
                    }
                    return;
                }
                
                // 舊分頁刪除按鈕
                if (oldTabClose) {
                    e.stopPropagation();
                    state.tabToDelete = oldTabClose.dataset.tabId;
                    document.getElementById('delete-tab-modal').classList.add('show');
                    hideOldTabsDropdown();
                    return;
                }
                
                // 舊分頁項目點擊
                if (oldTabItem) {
                    switchTab(oldTabItem.dataset.tabId);
                    hideOldTabsDropdown();
                    return;
                }
                
                // 一般分頁的刪除按鈕
                if (closeBtn) {
                    e.stopPropagation();
                    state.tabToDelete = closeBtn.dataset.tabId;
                    document.getElementById('delete-tab-modal').classList.add('show');
                } else if (tab) {
                    switchTab(tab.dataset.tabId);
                }
            });
            
            // 點擊遮罩或其他地方關閉舊分頁下拉選單
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.old-tabs-wrapper') && !e.target.closest('.old-tabs-dropdown')) {
                    hideOldTabsDropdown();
                }
            });

            // fixed 定位在捲動/改視窗大小後會失準（按鈕動了、選單沒動）→ 直接收起來
            // （手機是 CSS 底部抽屜，不受捲動影響 → 不收）
            const hideOldTabsIfDesktop = () => { if (window.innerWidth > 768) hideOldTabsDropdown(); };
            window.addEventListener('resize', hideOldTabsDropdown);
            window.addEventListener('scroll', hideOldTabsIfDesktop, { passive: true });

            // 下拉選單已附到 body，事件需另外綁
            document.addEventListener('click', (e) => {
                // 年份分組收合／展開（renderTabs 會重建整個 dropdown 節點 → 重畫後要自己把 show 與座標補回來）
                const grpHd = e.target.closest('.old-tabs-dropdown .old-tab-group-hd');
                if (grpHd) {
                    e.stopPropagation();
                    const y = grpHd.dataset.year;
                    if (oldTabsExpandedYears.has(y)) oldTabsExpandedYears.delete(y);
                    else oldTabsExpandedYears.add(y);
                    renderTabs();
                    document.getElementById('old-tabs-dropdown')?.classList.add('show');
                    positionOldTabsDropdown(document.querySelector('.old-tabs-btn'));
                    document.getElementById('old-tabs-overlay')?.classList.add('show');
                    return;
                }
                const closeItem = e.target.closest('.old-tabs-dropdown .old-tab-close');
                if (closeItem) {
                    e.stopPropagation();
                    state.tabToDelete = closeItem.dataset.tabId;
                    document.getElementById('delete-tab-modal').classList.add('show');
                    hideOldTabsDropdown();
                    return;
                }
                const item = e.target.closest('.old-tabs-dropdown .old-tab-item');
                if (item) {
                    switchTab(item.dataset.tabId);
                    hideOldTabsDropdown();
                }
            });
            
            document.getElementById('old-tabs-overlay').addEventListener('click', () => {
                hideOldTabsDropdown();
            });
            
            function showOldTabsDropdown() {
                document.getElementById('old-tabs-dropdown')?.classList.add('show');
                document.getElementById('old-tabs-overlay')?.classList.add('show');
            }
            
            // 下拉選單附在 body → 定位基準不是按鈕，開啟時自己算（fixed 座標）
            // ⚠ 手機 ≤768px 走 CSS 底部抽屜，必須把 inline 座標清掉，否則 inline 會壓過 @media
            function positionOldTabsDropdown(btn) {
                const dd = document.getElementById('old-tabs-dropdown');
                if (!dd || !btn) return;
                if (window.innerWidth <= 768) { dd.style.top = ''; dd.style.left = ''; dd.style.right = ''; return; }
                const r = btn.getBoundingClientRect();
                dd.style.right = 'auto';
                dd.style.top = `${Math.round(r.bottom + 4)}px`;
                // 靠按鈕右緣對齊；貼近視窗邊緣時往內收（窄螢幕不溢出）
                const w = dd.offsetWidth || 180;
                dd.style.left = `${Math.round(Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)))}px`;
            }

            function hideOldTabsDropdown() {
                document.getElementById('old-tabs-dropdown')?.classList.remove('show');
                document.getElementById('old-tabs-overlay')?.classList.remove('show');
            }

            // Add tab button
            document.getElementById('add-tab-btn').addEventListener('click', () => {
                const start = getDefaultStartDate();
                document.getElementById('new-tab-start').value = formatDateForInput(start);
                const end = new Date(start);
                end.setDate(end.getDate() + 27);
                document.getElementById('new-tab-end').value = formatDateForInput(end);
                document.getElementById('new-tab-modal').classList.add('show');
            });

            // New tab modal
            document.getElementById('new-tab-cancel').addEventListener('click', () => {
                document.getElementById('new-tab-modal').classList.remove('show');
            });

            document.getElementById('new-tab-confirm').addEventListener('click', () => {
                const start = document.getElementById('new-tab-start').value;
                const end = document.getElementById('new-tab-end').value;
                if (start && end) {
                    createNewTab(new Date(start), new Date(end));
                }
                document.getElementById('new-tab-modal').classList.remove('show');
            });

            // Delete tab modal
            document.getElementById('delete-tab-cancel').addEventListener('click', () => {
                document.getElementById('delete-tab-modal').classList.remove('show');
            });

            document.getElementById('delete-tab-confirm').addEventListener('click', () => {
                if (state.tabToDelete) {
                    deleteTab(state.tabToDelete);
                    state.tabToDelete = null;
                }
                document.getElementById('delete-tab-modal').classList.remove('show');
            });

            // Tab content date changes - 統計區間
            document.getElementById('tab-content').addEventListener('blur', (e) => {
                if (e.target.id === 'tab-stats-start' || e.target.id === 'tab-stats-end') {
                    const tab = getActiveTab();
                    if (tab && e.target.value) {
                        if (e.target.id === 'tab-stats-start') {
                            // 統計起始日（不調整，保持使用者輸入）
                            tab.statsStartDate = e.target.value;
                            // 顯示區間自動擴展到週一
                            tab.startDate = formatDateForInput(getMonday(new Date(e.target.value)));
                        }
                        if (e.target.id === 'tab-stats-end') {
                            // 統計結束日（不調整，保持使用者輸入）
                            tab.statsEndDate = e.target.value;
                            // 顯示區間自動擴展到週五
                            tab.endDate = formatDateForInput(getFriday(new Date(e.target.value)));
                        }
                        saveToStorage();
                        renderTabs();
                        renderTabContent();
                    }
                }
            }, true);

            // Cell and case tag clicks
            document.addEventListener('click', (e) => {
                const popup = document.getElementById('type-popup');
                const popupBtn = e.target.closest('.type-popup-btn');
                const caseTag = e.target.closest('.case-tag');
                const cell = e.target.closest('.cell');
                // 檢查是否為手機唯讀模式（不是編輯模式）
                const isMobileReadonly = document.body.classList.contains('mobile-readonly');
                const isMobileEditing = document.body.classList.contains('mobile-editing');

                if (popupBtn) {
                    const type = popupBtn.dataset.type;
                    hideTypePopup();
                    if (type === 'blocked') showBlockedModal();
                    else showCaseModal(type);
                    return;
                }

                if (!popup.contains(e.target)) hideTypePopup();

                // 領藥左條：點擊循環 一般→未領→已領（不觸發編輯/拖曳/選格）
                const medStrip = e.target.closest('.med-strip');
                if (medStrip && caseTag) {
                    e.stopPropagation();
                    toggleMedState(caseTag.dataset.cellKey, parseInt(caseTag.dataset.index));
                    return;
                }

                if (caseTag) {
                    const isEmpty = caseTag.dataset.isEmpty === 'true';
                    const isSaturday = caseTag.dataset.saturday === 'true';
                    
                    if (isEmpty) {
                        if (isMobileReadonly) return; // 手機唯讀不能新增
                        
                        state.selectedCell = caseTag.dataset.cellKey;
                        state.selectedSlotIndex = parseInt(caseTag.dataset.index);
                        
                        if (isSaturday) {
                            showCaseModal('mri');
                        } else {
                            showTypePopup(caseTag);
                        }
                    } else {
                        // 點擊已存在的案例
                        if (isMobileReadonly) {
                            // 手機唯讀模式：顯示詳細資訊
                            showCaseDetail(caseTag.dataset.cellKey, parseInt(caseTag.dataset.index));
                        } else if (isMobileEditing) {
                            // 手機編輯模式：直接編輯案例
                            editCase(caseTag.dataset.cellKey, parseInt(caseTag.dataset.index));
                        } else if (isSaturday) {
                            // 週六 MRI：點擊直接編輯（因為格子太窄）
                            editCase(caseTag.dataset.cellKey, parseInt(caseTag.dataset.index));
                        }
                    }
                } else if (cell && !e.target.closest('.case-actions')) {
                    state.selectedCell = cell.dataset.cellKey;
                    state.selectedSlotIndex = null;
                }
            });

            // Edit/Delete buttons
            document.addEventListener('click', (e) => {
                const editBtn = e.target.closest('.edit-btn');
                const deleteBtn = e.target.closest('.delete-btn');
                const caseTag = e.target.closest('.case-tag');

                if (deleteBtn && caseTag) {
                    e.stopPropagation();
                    deleteCase(caseTag.dataset.cellKey, parseInt(caseTag.dataset.index));
                } else if (editBtn && caseTag) {
                    e.stopPropagation();
                    editCase(caseTag.dataset.cellKey, parseInt(caseTag.dataset.index));
                }
            });

            // Keyboard：只保留 Escape（關 modal）；數字/字母快捷鍵已停用（user 不用，且會誤觸 caselist 輸入）
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    hideTypePopup();
                    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show'));
                }
            });

            // Drag and drop
            setupDragAndDrop();

            // Modal events
            setupModalEvents();
        }

        function showTypePopup(targetElement) {
            const popup = document.getElementById('type-popup');
            const rect = targetElement.getBoundingClientRect();
            
            let left = rect.right + 8;
            let top = rect.top;
            
            if (left + 180 > window.innerWidth) left = rect.left - 180;
            if (top + 180 > window.innerHeight) top = window.innerHeight - 190;
            
            popup.style.left = left + 'px';
            popup.style.top = top + 'px';
            popup.classList.add('show');
        }

        function hideTypePopup() {
            document.getElementById('type-popup').classList.remove('show');
        }

        let currentModalType = null;
        let editingCase = null;

        function showCaseModal(type, existingData = null) {
            currentModalType = type;
            editingCase = existingData;

            const modal = document.getElementById('case-modal');
            const title = document.getElementById('modal-title');
            const chartField = document.getElementById('chart-no-field');
            const noteField = document.getElementById('note-field');
            const statusField = document.getElementById('status-field');
            const otherSubtypeField = document.getElementById('other-subtype-field');
            const otherCustomField = document.getElementById('other-custom-field');
            const timeInput = document.getElementById('case-time');
            const chartInput = document.getElementById('chart-no');
            const noteInput = document.getElementById('note-text');
            const otherSubtypeSelect = document.getElementById('other-subtype');
            const otherCustomInput = document.getElementById('other-custom');

            const defaultTime = getDefaultTime(type, state.selectedCell);
            timeInput.value = existingData?.time || defaultTime;
            chartInput.value = existingData?.chartNo || '';
            noteInput.value = existingData?.note || '';

            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.status === (existingData?.status || 'confirmed'));
            });

            // 重置 Other 相關欄位
            otherSubtypeField.style.display = 'none';
            otherCustomField.style.display = 'none';
            otherSubtypeSelect.value = 'PICC';
            otherCustomInput.value = '';

            if (type === 'note') {
                title.textContent = existingData ? '編輯備註' : '新增備註';
                chartField.style.display = 'none';
                noteField.style.display = 'block';
                statusField.style.display = 'none';
            } else if (type === 'mri') {
                title.textContent = existingData ? '編輯 MRI' : '新增 MRI 時段';
                chartField.style.display = 'block';   // MRI 也填病歷號（匯出 docx 與 🗂 清單靠它配對）
                noteField.style.display = 'none';
                statusField.style.display = 'block';
            } else if (type === 'other') {
                title.textContent = existingData ? '編輯 Other' : '新增 Other';
                chartField.style.display = 'block';
                noteField.style.display = 'none';
                statusField.style.display = 'block';
                otherSubtypeField.style.display = 'block';
                
                // 編輯時載入現有子類型
                if (existingData?.otherSubtype) {
                    const isPreset = otherSubtypes.includes(existingData.otherSubtype);
                    if (isPreset) {
                        otherSubtypeSelect.value = existingData.otherSubtype;
                    } else {
                        otherSubtypeSelect.value = '_custom';
                        otherCustomField.style.display = 'block';
                        otherCustomInput.value = existingData.otherSubtype;
                    }
                }
            } else {
                title.textContent = existingData ? `編輯 ${caseTypeLabels[type]}` : `新增 ${caseTypeLabels[type]}`;
                chartField.style.display = 'block';
                noteField.style.display = 'none';
                statusField.style.display = 'block';
            }

            // 只有週六 MRI 編輯模式才顯示刪除按鈕（因為格子太窄點不到外部按鈕）
            // 或手機編輯模式下編輯既有案例時也顯示刪除按鈕
            const deleteBtn = document.getElementById('modal-delete');
            const isSaturdayMRI = existingData && type === 'mri' && state.selectedCell && 
                new Date(state.selectedCell.split('-').slice(0, 3).join('-')).getDay() === 6;
            const isMobileEditing = document.body.classList.contains('mobile-editing') && existingData;
            deleteBtn.style.display = (isSaturdayMRI || isMobileEditing) ? 'block' : 'none';

            modal.classList.add('show');
            if (type === 'note') {
                noteInput.focus();
            } else if (type === 'other') {
                otherSubtypeSelect.focus();
            } else if (defaultTime) {
                chartInput.focus();
            } else {
                timeInput.focus();
            }
        }

        function showBlockedModal() {
            const cellData = state.cellData[state.selectedCell];
            document.getElementById('blocked-reason').value = cellData?.blockedReason || '';
            document.getElementById('blocked-modal').classList.add('show');
            document.getElementById('blocked-reason').focus();
        }

        // 手機版：顯示案例詳細資訊
        function showCaseDetail(cellKey, index) {
            const cellData = state.cellData[cellKey];
            if (!cellData) return;
            
            let cases = cellData.cases;
            if (!Array.isArray(cases)) {
                cases = Object.values(cases || {});
            }
            
            // 過濾掉空位，用過濾後的 index
            const realCases = cases.filter(c => c && c.type !== 'slot' && !c.isEmpty);
            if (index >= realCases.length) return;
            
            const caseData = realCases[index];
            if (!caseData) return;
            
            const typeLabel = caseTypeLabels[caseData.type] || caseData.type;
            const statusLabel = caseData.status === 'tentative' ? '暫定' : '確定';
            
            // 解析日期
            const period = cellKey.endsWith('-AM') ? '上午' : '下午';
            
            document.getElementById('detail-title').textContent = `${typeLabel} 詳細資訊`;
            document.getElementById('detail-type').textContent = `${typeLabel}（${period}）`;
            document.getElementById('detail-time').textContent = caseData.time || '未設定';
            document.getElementById('detail-chart').textContent = caseData.chartNo || '未填寫';
            document.getElementById('detail-status').textContent = statusLabel;
            
            document.getElementById('case-detail-modal').classList.add('show');
        }

        function setupModalEvents() {
            document.getElementById('modal-cancel').addEventListener('click', () => {
                document.getElementById('case-modal').classList.remove('show');
                editingCase = null;
            });

            document.getElementById('modal-confirm').addEventListener('click', saveCaseFromModal);

            // 刪除按鈕
            document.getElementById('modal-delete').addEventListener('click', () => {
                if (editingCase) {
                    const cellKey = state.selectedCell;
                    if (editingCase.id) {
                        deleteCaseById(cellKey, editingCase.id);
                    } else if (editingCase._originalIndex !== undefined) {
                        deleteCase(cellKey, editingCase._originalIndex);
                    }
                    document.getElementById('case-modal').classList.remove('show');
                    editingCase = null;
                }
            });

            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            
            // Other 子類型下拉選單切換
            document.getElementById('other-subtype').addEventListener('change', (e) => {
                const customField = document.getElementById('other-custom-field');
                if (e.target.value === '_custom') {
                    customField.style.display = 'block';
                    document.getElementById('other-custom').focus();
                } else {
                    customField.style.display = 'none';
                }
            });

            document.getElementById('blocked-cancel').addEventListener('click', () => {
                document.getElementById('blocked-modal').classList.remove('show');
            });

            document.getElementById('blocked-confirm').addEventListener('click', toggleBlocked);

            // 案例詳細資訊關閉按鈕
            document.getElementById('detail-close').addEventListener('click', () => {
                document.getElementById('case-detail-modal').classList.remove('show');
            });

            ['case-time', 'chart-no', 'note-text', 'other-custom'].forEach(id => {
                document.getElementById(id).addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); saveCaseFromModal(); }
                });
            });

            document.getElementById('blocked-reason').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); toggleBlocked(); }
            });

            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) { overlay.classList.remove('show'); editingCase = null; }
                });
            });
        }

        function saveCaseFromModal() {
            let time = document.getElementById('case-time').value.trim();
            const chartNo = document.getElementById('chart-no').value.trim();
            const note = document.getElementById('note-text').value.trim();
            const status = document.querySelector('.status-btn.active')?.dataset.status || 'confirmed';

            // 自動補冒號：1300 → 13:00, 900 → 09:00
            time = formatTimeInput(time);

            const caseData = { type: currentModalType, time, chartNo, note, status };
            
            // 處理 Other 子類型
            if (currentModalType === 'other') {
                const subtypeSelect = document.getElementById('other-subtype').value;
                if (subtypeSelect === '_custom') {
                    caseData.otherSubtype = document.getElementById('other-custom').value.trim() || 'Other';
                } else {
                    caseData.otherSubtype = subtypeSelect;
                }
            }

            // 穩定 id：編輯時沿用舊 id，新增時產生
            caseData.id = (editingCase && editingCase.id) || genCaseId();

            if (!state.cellData[state.selectedCell]) {
                state.cellData[state.selectedCell] = { blocked: false, blockedReason: '', cases: [] };
            }

            // 確保 cases 是陣列
            let cellCases = state.cellData[state.selectedCell].cases;
            if (!Array.isArray(cellCases)) {
                cellCases = Object.values(cellCases || {});
                state.cellData[state.selectedCell].cases = cellCases;
            }
            
            // 過濾掉空位，只保留真正案例
            let realCases = cellCases.filter(c => c && c.type !== 'slot' && !c.isEmpty);

            if (editingCase !== null && editingCase.id) {
                // 編輯：用穩定 id 找原案例（不靠物件參考，跨 Firebase 同步也不會斷）
                const realIndex = realCases.findIndex(c => c && c.id === editingCase.id);
                if (realIndex !== -1) {
                    realCases[realIndex] = caseData;
                } else {
                    realCases.push(caseData);
                }
            } else if (editingCase !== null && editingCase._originalIndex !== undefined) {
                // legacy fallback：舊 case 無 id（理論上 editCase 已補，保險用）
                const oldCase = cellCases[editingCase._originalIndex];
                const realIndex = realCases.findIndex(c => c === oldCase);
                if (realIndex !== -1) {
                    realCases[realIndex] = caseData;
                } else {
                    realCases.push(caseData);
                }
            } else {
                // 新增
                realCases.push(caseData);
            }
            
            // 按時間排序（時間早的在前，沒有時間的排最後）
            realCases.sort((a, b) => {
                const timeA = a.time || '99:99';
                const timeB = b.time || '99:99';
                return timeA.localeCompare(timeB);
            });
            
            state.cellData[state.selectedCell].cases = realCases;

            saveCell(state.selectedCell);
            renderTabContent();
            state.selectedSlotIndex = null;

            document.getElementById('case-modal').classList.remove('show');
            editingCase = null;
        }

        function toggleBlocked() {
            const reason = document.getElementById('blocked-reason').value.trim();

            if (!state.cellData[state.selectedCell]) {
                state.cellData[state.selectedCell] = { blocked: false, blockedReason: '', cases: [] };
            }

            const cellData = state.cellData[state.selectedCell];
            cellData.blocked = !cellData.blocked;
            cellData.blockedReason = cellData.blocked ? reason : '';

            saveCell(state.selectedCell);
            renderTabContent();
            document.getElementById('blocked-modal').classList.remove('show');
        }

        // 用穩定 id 刪除（不靠物件參考 / index，跨 Firebase 同步也正確）
        function deleteCaseById(cellKey, id) {
            const cellData = state.cellData[cellKey];
            if (!cellData) return;
            let cases = cellData.cases;
            if (!Array.isArray(cases)) {
                cases = Object.values(cases || {});
                state.cellData[cellKey].cases = cases;
            }
            const idx = cases.findIndex(c => c && c.id === id);
            if (idx !== -1) {
                cases.splice(idx, 1);
                saveCell(cellKey);
                renderTabContent();
            }
        }

        // 領藥狀態循環：一般(undefined) → 未領(pending) → 已領(collected) → 一般
        function toggleMedState(cellKey, index) {
            const cellData = state.cellData[cellKey];
            if (!cellData) return;
            let cases = cellData.cases;
            if (!Array.isArray(cases)) {
                cases = Object.values(cases || {});
                state.cellData[cellKey].cases = cases;
            }
            const realCases = cases.filter(c => c && c.type !== 'slot' && !c.isEmpty);
            const c = realCases[index];
            if (!c) return;
            const next = { undefined: 'pending', pending: 'collected', collected: undefined };
            const nv = next[c.medState];
            if (nv === undefined) delete c.medState; else c.medState = nv;
            saveCell(cellKey);
            renderTabContent();
        }

        function deleteCase(cellKey, index) {
            const cellData = state.cellData[cellKey];
            if (!cellData) return;

            // 確保 cases 是陣列
            let cases = cellData.cases;
            if (!Array.isArray(cases)) {
                cases = Object.values(cases || {});
                state.cellData[cellKey].cases = cases;
            }

            // 過濾掉空位，找到真正的案例
            const realCases = cases.filter(c => c && c.type !== 'slot' && !c.isEmpty);
            if (index >= realCases.length) return;

            const caseToDelete = realCases[index];
            
            // 從原始陣列中找到並移除
            const originalIndex = cases.findIndex(c => c === caseToDelete);
            if (originalIndex !== -1) {
                cases.splice(originalIndex, 1);
                saveCell(cellKey);
                renderTabContent();
            }
        }

        function editCase(cellKey, index) {
            const cellData = state.cellData[cellKey];
            if (!cellData) return;
            
            // 確保 cases 是陣列
            let cases = cellData.cases;
            if (!Array.isArray(cases)) {
                cases = Object.values(cases || {});
                state.cellData[cellKey].cases = cases;
            }
            
            // 過濾掉空位，找到真正的案例
            const realCases = cases.filter(c => c && c.type !== 'slot' && !c.isEmpty);
            if (index >= realCases.length) return;
            
            const caseData = realCases[index];
            if (caseData && !caseData.id) caseData.id = genCaseId(); // 補 id（舊 case）

            // 找到在原始陣列中的位置
            const originalIndex = cases.findIndex(c => c === caseData);
            
            if (caseData && caseData.type !== 'slot') {
                state.selectedCell = cellKey;
                // 把 originalIndex 放在 caseData 上傳給 showCaseModal
                caseData._originalIndex = originalIndex;
                showCaseModal(caseData.type, caseData);
            }
        }

        // ===== 閱讀清單功能 =====
        
        function renderReadingList() {
            const itemsContainer = document.getElementById('reading-list-items');
            const emptyState = document.getElementById('reading-list-empty');
            
            if (readingList.length === 0) {
                itemsContainer.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            itemsContainer.style.display = 'block';
            emptyState.style.display = 'none';
            
            itemsContainer.innerHTML = readingList.map(item => `
                <div class="reading-item" data-id="${item.id}">
                    <div class="reading-item-content">
                        <div class="reading-item-title">${escapeHtml(item.title || item.url)}</div>
                        <div class="reading-item-url">${escapeHtml(item.url)}</div>
                        <div class="reading-item-time">${formatTimeAgo(item.createdAt)}</div>
                    </div>
                    <div class="reading-item-actions">
                        <button type="button" class="reading-item-btn open" data-url="${escapeHtml(item.url)}">開啟</button>
                        <button type="button" class="reading-item-btn delete" data-id="${item.id}">刪除</button>
                    </div>
                </div>
            `).join('');
        }
        
        function formatTimeAgo(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return '剛剛';
            if (minutes < 60) return `${minutes} 分鐘前`;
            if (hours < 24) return `${hours} 小時前`;
            if (days < 7) return `${days} 天前`;
            return new Date(timestamp).toLocaleDateString('zh-TW');
        }
        
        async function addReadingItem(url) {
            if (!url || !url.trim()) return;
            
            // 驗證 URL
            try {
                new URL(url);
            } catch {
                alert('請輸入有效的網址');
                return;
            }
            
            const id = 'r_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const item = {
                id: id,
                url: url.trim(),
                title: url.trim(), // 預設用 URL 當標題
                createdAt: Date.now()
            };
            
            // 嘗試抓取網頁標題
            fetchPageTitle(url.trim()).then(title => {
                if (title && firebaseReady) {
                    set(ref(fbDb, 'readings/' + id + '/title'), title);
                }
            });

            // 儲存到 Firebase
            if (firebaseReady) {
                await set(ref(fbDb, 'readings/' + id), item);
            } else {
                readingList.unshift(item);
                renderReadingList();
            }
            
            document.getElementById('reading-url-input').value = '';
        }
        
        async function fetchPageTitle(url) {
            try {
                // 使用 cors-anywhere 或類似服務來抓取標題
                // 由於 CORS 限制，這裡簡化處理，只從 URL 提取域名
                const urlObj = new URL(url);
                return urlObj.hostname + urlObj.pathname.substring(0, 30);
            } catch {
                return null;
            }
        }
        
        async function deleteReadingItem(id) {
            if (firebaseReady) {
                await remove(ref(fbDb, 'readings/' + id));
            } else {
                readingList = readingList.filter(item => item.id !== id);
                renderReadingList();
            }
        }
        
        function setupReadingListEvents() {
            // 開啟閱讀清單
            document.getElementById('reading-list-btn').addEventListener('click', () => {
                document.getElementById('reading-list-modal').classList.add('show');
                document.getElementById('reading-url-input').focus();
            });
            
            // 關閉閱讀清單
            document.getElementById('reading-list-close').addEventListener('click', () => {
                document.getElementById('reading-list-modal').classList.remove('show');
            });
            
            // 點擊背景關閉
            document.getElementById('reading-list-modal').addEventListener('click', (e) => {
                if (e.target.id === 'reading-list-modal') {
                    document.getElementById('reading-list-modal').classList.remove('show');
                }
            });
            
            // 加入閱讀項目
            document.getElementById('reading-add-btn').addEventListener('click', () => {
                const url = document.getElementById('reading-url-input').value;
                addReadingItem(url);
            });
            
            // Enter 鍵加入
            document.getElementById('reading-url-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const url = document.getElementById('reading-url-input').value;
                    addReadingItem(url);
                }
            });
            
            // 閱讀清單項目點擊
            document.getElementById('reading-list-items').addEventListener('click', (e) => {
                const openBtn = e.target.closest('.reading-item-btn.open');
                const deleteBtn = e.target.closest('.reading-item-btn.delete');
                
                if (openBtn) {
                    const url = openBtn.dataset.url;
                    // iOS PWA 模式下，用 <a> 標籤強制在 Safari 開啟
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
                
                if (deleteBtn) {
                    deleteReadingItem(deleteBtn.dataset.id);
                }
            });
        }

        let draggedItem = null, draggedFromCell = null, draggedIndex = null;

        function setupDragAndDrop() {
            document.addEventListener('dragstart', (e) => {
                const caseTag = e.target.closest('.case-tag');
                if (caseTag && caseTag.dataset.isEmpty !== 'true') {
                    draggedItem = caseTag;
                    draggedFromCell = caseTag.dataset.cellKey;
                    draggedIndex = parseInt(caseTag.dataset.index);
                    caseTag.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                }
            });

            document.addEventListener('dragend', () => {
                if (draggedItem) draggedItem.classList.remove('dragging');
                draggedItem = null; draggedFromCell = null; draggedIndex = null;
            });

            document.addEventListener('dragover', (e) => {
                const cell = e.target.closest('.cell');
                if (cell && draggedItem) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
            });

            document.addEventListener('drop', (e) => {
                const cell = e.target.closest('.cell');
                if (cell && draggedItem) {
                    e.preventDefault();
                    moveCase(draggedFromCell, draggedIndex, cell.dataset.cellKey);
                }
            });
        }

        function moveCase(fromCellKey, fromIndex, toCellKey) {
            const fromCellData = state.cellData[fromCellKey];
            if (!fromCellData) return;
            
            // 確保 cases 是陣列
            let fromCases = fromCellData.cases;
            if (!Array.isArray(fromCases)) {
                fromCases = Object.values(fromCases || {});
                state.cellData[fromCellKey].cases = fromCases;
            }
            
            // 過濾掉空位，找到真正的案例
            const realCases = fromCases.filter(c => c && c.type !== 'slot' && !c.isEmpty);
            if (fromIndex >= realCases.length) return;
            
            const caseData = realCases[fromIndex];
            
            // 從原始陣列中移除（找到真正的位置）
            const originalIndex = fromCases.findIndex(c => c === caseData);
            if (originalIndex !== -1) {
                fromCases.splice(originalIndex, 1);
            }

            if (!state.cellData[toCellKey]) {
                state.cellData[toCellKey] = { blocked: false, blockedReason: '', cases: [] };
            }
            
            // 確保目標 cases 是陣列
            let toCases = state.cellData[toCellKey].cases;
            if (!Array.isArray(toCases)) {
                toCases = Object.values(toCases || {});
                state.cellData[toCellKey].cases = toCases;
            }
            
            toCases.push(caseData);

            // 一次寫 from + to 兩個 cell（同一筆 update，原子性 OK）
            savePartial({
                [`scheduler/cellData/${fromCellKey}`]: state.cellData[fromCellKey] ?? null,
                [`scheduler/cellData/${toCellKey}`]: state.cellData[toCellKey] ?? null
            });
            renderTabContent();
        }

    </script>
