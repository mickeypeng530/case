    <script type="module">
        // ========== Firebase ==========
        import { fbAuth, fbDb } from "./firebase-init.js";
        import {
            GoogleAuthProvider,
            signInWithPopup, signInWithEmailAndPassword,
            onAuthStateChanged, signOut,
            setPersistence, inMemoryPersistence
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            ref, set, get, update, remove, onValue
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        // Procedure 清單共用模組（與 opd.html 的 🗂 tab 同一份實作）
        import { createProcList, PLC_VERSION } from "./proclist-core.js?v=__SHA__";

        // 版本戳：workflow 部署時把 __BUILD__ 換成 git short SHA（本地未替換 → 'dev'）
        const PAGE_BUILD = '__BUILD__'.indexOf('BUILD') >= 0 ? 'dev' : '__BUILD__';
        function renderVersionInfo() {
            const el = document.getElementById('version-info');
            if (!el) return;
            const mismatch = PAGE_BUILD !== PLC_VERSION && PAGE_BUILD !== 'dev';
            el.textContent = mismatch ? `${PAGE_BUILD}⚠${PLC_VERSION}` : PAGE_BUILD;
            el.style.color = mismatch ? 'var(--color-warning, #f59e0b)' : '';
            el.title = mismatch
                ? `頁面版 ${PAGE_BUILD} 與模組版 ${PLC_VERSION} 不一致 → 有檔卡舊快取，硬刷新（Ctrl+Shift+R）或重裝 PWA`
                : `版本 ${PAGE_BUILD}`;
        }

        // ========== 登入 ==========
        let currentUser = null;

        function showLoginError(err) {
            const error = document.getElementById('login-error');
            const info = document.getElementById('login-info');
            console.error('登入失敗:', err);
            let msg = err.message || err.code;
            if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                msg = '帳號或密碼錯誤';
            } else if (err.code === 'auth/too-many-requests') {
                msg = '嘗試次數過多，請稍後再試';
            } else if (err.code === 'auth/network-request-failed') {
                msg = '網路連線錯誤';
            } else if (err.code === 'auth/popup-closed-by-user') {
                msg = '已取消登入';
            }
            error.textContent = msg;
            error.style.display = 'block';
            info.style.display = 'none';
        }

        // 目前選的 dest（toggle 控制）；預設 = case（因在 index.html）
        let selectedDest = 'case';

        // 登入後依 dest 跳頁（'opd' / 'case'）；同頁不跳
        function redirectAfterLogin(dest) {
            if (dest === 'opd') window.location.href = 'opd.html';
            // dest === 'case' 時已在 index.html，不動
        }

        // Email/Password：不持久（每次都要重新輸入）
        async function loginWithEmailPassword(dest = selectedDest) {
            const emailInput = document.getElementById('email-input');
            const passwordInput = document.getElementById('password-input');
            const error = document.getElementById('login-error');
            const info = document.getElementById('login-info');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                error.textContent = '請輸入 Email 與密碼';
                error.style.display = 'block';
                return;
            }

            error.style.display = 'none';
            info.textContent = '登入中...';
            info.style.display = 'block';

            try {
                // NONE：關閉/重新整理頁面就登出，每次都要重輸（適合診間共用電腦）
                await setPersistence(fbAuth, inMemoryPersistence);
                await signInWithEmailAndPassword(fbAuth, email, password);
                redirectAfterLogin(dest);
            } catch (err) {
                showLoginError(err);
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // 偵測是否為 PWA / standalone 模式（iOS 加到主畫面、Android 安裝為 PWA）
        function isStandaloneMode() {
            return window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
        }

        // Google：持久登入（適合自己電腦/家裡）
        async function loginWithGoogle() {
            const error = document.getElementById('login-error');
            const info = document.getElementById('login-info');
            error.style.display = 'none';
            info.textContent = '登入中...';
            info.style.display = 'block';

            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(fbAuth, provider);
                redirectAfterLogin(selectedDest);
            } catch (err) {
                showLoginError(err);
            }
        }

        async function logout() {
            await signOut(fbAuth);
            location.reload();
        }

        // 頁面載入時檢查
        document.addEventListener('DOMContentLoaded', () => {
            // 偵測手機，預設為唯讀模式
            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                document.body.classList.add('mobile-readonly');
            }

            // 監聽登入狀態
            onAuthStateChanged(fbAuth, (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    const provider = user.providerData[0]?.providerId || 'unknown';
                    const providerIcon = provider === 'google.com' ? 'G' : (provider === 'password' ? 'E' : '?');
                    const shortName = (user.email || '').split('@')[0] || user.uid.substring(0, 6);
                    const userInfo = document.getElementById('user-info');
                    if (userInfo) {
                        userInfo.textContent = `${providerIcon}:${shortName}`;
                        userInfo.title = `${provider} | ${user.email || user.uid}`;
                    }
                    console.log('已登入:', user.email, '| 登入方式:', provider, '| UID:', user.uid);
                    init();
                } else {
                    currentUser = null;
                    document.getElementById('login-screen').style.display = 'flex';
                    document.getElementById('main-app').style.display = 'none';
                }
            });

            // Email/Password 登入按鈕
            // dest toggle（OPD / Case 切換）
            document.querySelectorAll('#dest-toggle button').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedDest = btn.dataset.dest;
                    document.querySelectorAll('#dest-toggle button').forEach(b => b.classList.toggle('active', b === btn));
                });
            });
            document.getElementById('login-btn').addEventListener('click', () => loginWithEmailPassword());

            // Enter 鍵登入
            const submitOnEnter = (e) => { if (e.key === 'Enter') loginWithEmailPassword(); };
            document.getElementById('email-input').addEventListener('keydown', submitOnEnter);
            document.getElementById('password-input').addEventListener('keydown', submitOnEnter);

            // Google 登入按鈕
            document.getElementById('google-login-btn').addEventListener('click', loginWithGoogle);

            // 登出按鈕
            document.getElementById('logout-btn')?.addEventListener('click', () => {
                if (confirm('確定要登出嗎？')) logout();
            });
            
            // 手機版編輯模式切換
            document.getElementById('mobile-edit-btn').addEventListener('click', () => {
                const btn = document.getElementById('mobile-edit-btn');
                const isEditing = document.body.classList.contains('mobile-editing');
                
                if (isEditing) {
                    // 關閉編輯模式
                    document.body.classList.remove('mobile-editing');
                    document.body.classList.add('mobile-readonly');
                    btn.textContent = '✏️ 開啟編輯';
                    btn.classList.remove('editing');
                } else {
                    // 開啟編輯模式
                    document.body.classList.remove('mobile-readonly');
                    document.body.classList.add('mobile-editing');
                    btn.textContent = '🔒 關閉編輯';
                    btn.classList.add('editing');
                }
            });
        });
        
        // Firebase 變數
        let firebaseReady = false;

        // State
        let state = {
            tabs: [],
            activeTabId: null,
            selectedCell: null,
            selectedSlotIndex: null,
            cellData: {},
            mobileWeekIndex: 0  // 手機版目前顯示的週數
        };
        
        // 閱讀清單 state（獨立存儲）
        let readingList = [];

        const dayNames = ['一', '二', '三', '四', '五'];
        const caseTypeLabels = {
            'ct-nb': 'CT NB', 'ct-nb-prf': 'CT NB pRF', 'stame': 'sTAME', 'ctame': 'cTAME',
            'sono': 'Sono', 'mri': 'MRI', 'ct': 'CT', 'arthro': 'Arthro', 'other': 'Other', 'slot': '空位', 'note': '備註'
        };
        // Other 常用子類型
        const otherSubtypes = ['PICC', 'Bone', 'Drain', 'PCN', 'Lung Biopsy'];
        const DEFAULT_SLOTS_PER_CELL = 2;
        let eventsBound = false;  // 防止重複綁定事件
        // 換日自動重畫 past-date 斜線：renderTabContent 的 past 判定是 render 當下算的、凍結在 DOM，
        // 掛著過夜沒資料變動就不會重算。用「回到分頁 focus 檢查」+「午夜 timer」補跨日重畫（純本地，0 Firebase）
        let _lastRenderedDay = '';
        let _midnightTimer = null;

        // Init
        async function init() {
            renderVersionInfo();
            loadFromLocalStorage();
            if (state.tabs.length === 0) {
                createNewTab();
            }
            renderTabs();
            renderTabContent();
            
            // 只綁定一次事件
            if (!eventsBound) {
                setupEventListeners();
                setupReadingListEvents();
                setupDayRolloverWatch();
                eventsBound = true;
            }
            
            // 初始化 Firebase
            await initFirebase();
        }

        async function initFirebase() {
            try {
                showStatus('連線中...', true);
                firebaseReady = true;

                // 監聽雲端資料變化（即時同步）；unsub 存起來（防 leak 紀律，跟 opd.html 一致）
                if (state.schedulerListener) state.schedulerListener();
                state.schedulerListener = onValue(ref(fbDb, 'scheduler'), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        state.tabs = data.tabs || [];
                        state.activeTabId = data.activeTabId || (state.tabs[0]?.id || null);
                        state.cellData = data.cellData || {};
                        // 補 case id（修「物件參考比對」斷鏈 bug）；補完寫回，idempotent 不會無限迴圈
                        const _idsAdded = ensureCaseIds();
                        saveToLocalStorage();
                        if (_idsAdded) saveToStorage();
                        renderTabs();
                        renderTabContent();
                    }
                    showStatus('已同步', false);
                });

                // 監聽閱讀清單
                if (state.readingsListener) state.readingsListener();
                state.readingsListener = onValue(ref(fbDb, 'readings'), (snapshot) => {
                    const data = snapshot.val();
                    readingList = data ? Object.values(data) : [];
                    readingList.sort((a, b) => b.createdAt - a.createdAt); // 最新的在前
                    renderReadingList();
                });
            } catch (error) {
                console.error('Firebase 初始化失敗:', error);
                showStatus('離線模式', false);
            }
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('caseSchedulerV2');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.tabs = parsed.tabs || [];
                state.activeTabId = parsed.activeTabId || (state.tabs[0]?.id || null);
                state.cellData = parsed.cellData || {};
                ensureCaseIds(); // 離線時也補 id；寫回等 Firebase 連上後統一處理
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('caseSchedulerV2', JSON.stringify({
                tabs: state.tabs,
                activeTabId: state.activeTabId,
                cellData: state.cellData
            }));
        }

        function saveToStorage() {
            showStatus('儲存中...', true);
            saveToLocalStorage();

            // 同步到 Firebase
            if (firebaseReady && fbDb) {
                set(ref(fbDb, 'scheduler'), {
                    tabs: state.tabs,
                    activeTabId: state.activeTabId,
                    cellData: state.cellData,
                    lastUpdated: new Date().toISOString()
                }).then(() => {
                    showStatus('已同步', false);
                }).catch((error) => {
                    console.error('同步失敗:', error);
                    showStatus('同步失敗', false);
                });
            } else {
                showStatus('離線模式', false);
            }
        }

        // ===== 欄位級寫入（高頻路徑用）=====
        // 只寫動到的那一格，不整包 set scheduler 節點：
        // ① 兩裝置同開時不再互蓋整包 ② 寫入量從 ~54KB 縮到 ~1KB
        // 結構性操作（tab 增刪、批次填補）仍走 saveToStorage()
        function savePartial(updates) {
            showStatus('儲存中...', true);
            saveToLocalStorage(); // 本地仍整包（單機快取，無互蓋問題）
            if (firebaseReady && fbDb) {
                updates['scheduler/lastUpdated'] = new Date().toISOString();
                update(ref(fbDb), updates).then(() => {
                    showStatus('已同步', false);
                }).catch((error) => {
                    console.error('同步失敗:', error);
                    showStatus('❌ 同步失敗', false);
                });
            } else {
                showStatus('離線模式', false);
            }
        }
        function saveCell(cellKey) {
            const cell = state.cellData?.[cellKey];
            savePartial({ [`scheduler/cellData/${cellKey}`]: cell ?? null });
        }

        function showStatus(text, isSaving) {
            const dot = document.getElementById('storage-dot');
            const textEl = document.getElementById('storage-text');
            
            if (isSaving) {
                dot.classList.add('saving');
            } else {
                dot.classList.remove('saving');
            }
            textEl.textContent = text;
        }

        function showSaving() {
            showStatus('儲存中...', true);
        }

        function showSaved() {
            showStatus('已儲存', false);
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // 回 MM/DD（顯示用）。改名自 formatDate —— opd.html 的 formatDate 回 YYYY-MM-DD，同名不同義是 copy-paste 地雷
        function formatDateMD(date) {
            const d = new Date(date);
            return `${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')}`;
        }

        function formatDateForInput(date) {
            return new Date(date).toISOString().split('T')[0];
        }

        // HTML 跳脫（跟 opd.html 同款）：所有 user 輸入進 template literal 前必過這層
        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // 排程 case 穩定 id：取代「物件參考比對」(c === oldCase)，跨 Firebase 同步也不會斷
        function genCaseId() {
            return 'cs_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        // 一次性 migration：補上所有排程 case 缺少的 id。回傳是否有變動
        function ensureCaseIds() {
            let changed = false;
            Object.values(state.cellData || {}).forEach(cell => {
                if (!cell) return;
                const cases = Array.isArray(cell.cases) ? cell.cases : Object.values(cell.cases || {});
                cases.forEach(c => {
                    if (c && !c.isEmpty && c.type !== 'slot' && !c.id) {
                        c.id = genCaseId();
                        changed = true;
                    }
                });
            });
            return changed;
        }

        // 找到該日期那週的週一
        // 找到該日期當週的週一（用於起始日：當天或之前最近的週一）
        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff);
            return d;
        }

        // 找到該日期當週的週五（用於結束日：當天或之後最近的週五）
        function getFriday(date) {
            const d = new Date(date);
            const day = d.getDay();
            // 如果是週六(6)或週日(0)，找下一週的週五
            if (day === 6) {
                d.setDate(d.getDate() + 6); // 週六 +6 = 下週五
            } else if (day === 0) {
                d.setDate(d.getDate() + 5); // 週日 +5 = 下週五
            } else {
                // 週一到週五，找當週週五
                d.setDate(d.getDate() + (5 - day));
            }
            return d;
        }

        function getDefaultStartDate() {
            const today = new Date();
            return getMonday(today);
        }

        function getTabName(tab) {
            // 優先用統計區間，舊資料用顯示區間
            const start = tab.statsStartDate || tab.startDate;
            const end = tab.statsEndDate || tab.endDate;
            return `${formatDateMD(start)}-${formatDateMD(end)}`;
        }

        // 分頁年份（舊分頁下拉分組用）。⚠ getTabName 只有 MM/DD，而且還餵 docx 檔名（exportToDocx），不要動它
        function tabYear(tab) {
            return String(tab.statsStartDate || tab.startDate || '').slice(0, 4) || '—';
        }
        // 舊分頁下拉展開中的年份；oldTabsYearsInit = 是否已套過預設（之後尊重使用者收合）
        const oldTabsExpandedYears = new Set();
        let oldTabsYearsInit = false;

        function getActiveTab() {
            return state.tabs.find(t => t.id === state.activeTabId);
        }

        // Tab Management
        function createNewTab(startDate = null, endDate = null) {
            // 統計區間：使用者輸入的日期
            const statsStart = startDate ? new Date(startDate) : getDefaultStartDate();
            const statsEnd = endDate ? new Date(endDate) : new Date(new Date(statsStart).setDate(statsStart.getDate() + 13));
            
            // 顯示區間：擴展到完整週
            const displayStart = getMonday(statsStart);
            const displayEnd = getFriday(statsEnd);
            
            const newTab = {
                id: generateId(),
                // 統計用（使用者設定的區間）
                statsStartDate: formatDateForInput(statsStart),
                statsEndDate: formatDateForInput(statsEnd),
                // 顯示用（完整週）
                startDate: formatDateForInput(displayStart),
                endDate: formatDateForInput(displayEnd)
            };
            
            state.tabs.push(newTab);
            state.activeTabId = newTab.id;
            
            // 先渲染，再同步
            renderTabs();
            renderTabContent();
            saveToStorage();
            
            return newTab;
        }

        function deleteTab(tabId) {
            state.tabs = state.tabs.filter(t => t.id !== tabId);
            if (state.activeTabId === tabId) {
                state.activeTabId = state.tabs[0]?.id || null;
            }
            saveToStorage();
            renderTabs();
            renderTabContent();
        }

        function switchTab(tabId) {
            state.activeTabId = tabId;
            state.selectedCell = null;
            state.selectedSlotIndex = null;
            saveToStorage();
            renderTabs();
            renderTabContent();
        }

        // Rendering
        function renderTabs() {
            const container = document.getElementById('tabs-container');
            const addBtn = document.getElementById('add-tab-btn');
            
            // Clear existing tabs and old-tabs dropdown
            container.querySelectorAll('.tab, .old-tabs-wrapper').forEach(t => t.remove());
            
            // 按日期排序（最新的在後面）
            const sortedTabs = [...state.tabs].sort((a, b) => {
                const dateA = new Date(a.statsStartDate || a.startDate);
                const dateB = new Date(b.statsStartDate || b.startDate);
                return dateA - dateB;
            });
            
            // 分成最新 5 個和舊分頁
            // ⚠ 5 是「不讓 tab bar 換行」的上限（見 .tab 的緊湊尺寸註解）：5 組總寬 743px < 容器 984px。
            //   要再加到 6 之前先量——6 組總寬 853px，viewport <920px 就會斷成兩行
            const RECENT_TAB_COUNT = 5;
            const recentTabs = sortedTabs.slice(-RECENT_TAB_COUNT);
            const oldTabs = sortedTabs.slice(0, -RECENT_TAB_COUNT);

            // 渲染最新 5 個分頁
            recentTabs.forEach(tab => {
                const tabEl = document.createElement('button');
                tabEl.className = `tab ${tab.id === state.activeTabId ? 'active' : ''}`;
                tabEl.dataset.tabId = tab.id;
                tabEl.innerHTML = `
                    ${getTabName(tab)}
                    <span class="close-tab" data-tab-id="${tab.id}">✕</span>
                `;
                container.insertBefore(tabEl, addBtn);
            });
            
            // 如果有舊分頁，加入下拉選單
            if (oldTabs.length > 0) {
                const oldTabsWrapper = document.createElement('div');
                oldTabsWrapper.className = 'old-tabs-wrapper';
                
                const oldTabsBtn = document.createElement('button');
                oldTabsBtn.className = 'tab old-tabs-btn';
                oldTabsBtn.innerHTML = `📁 舊分頁 (${oldTabs.length}) ▼`;
                
                const dropdown = document.createElement('div');
                dropdown.className = 'old-tabs-dropdown';
                dropdown.id = 'old-tabs-dropdown';
                
                // 舊分頁列表：依年份分組（最新年在上，組內最新在上）
                const byYear = new Map();
                [...oldTabs].reverse().forEach(tab => {
                    const y = tabYear(tab);
                    if (!byYear.has(y)) byYear.set(y, []);
                    byYear.get(y).push(tab);
                });
                const years = [...byYear.keys()].sort().reverse();

                // 首次渲染才決定預設展開（最新年 + 目前分頁那年）；之後尊重使用者收合，別每次重畫又打開
                if (!oldTabsYearsInit) {
                    oldTabsYearsInit = true;
                    if (years.length) oldTabsExpandedYears.add(years[0]);
                    const act = state.tabs.find(t => t.id === state.activeTabId);
                    if (act) oldTabsExpandedYears.add(tabYear(act));
                }

                years.forEach(y => {
                    const open = oldTabsExpandedYears.has(y);
                    const hd = document.createElement('div');
                    hd.className = 'old-tab-group-hd';
                    hd.dataset.year = y;
                    hd.innerHTML = `<span><span class="caret">${open ? '▾' : '▸'}</span> ${escapeHtml(y)}</span>`
                        + `<span class="old-tab-group-count">${byYear.get(y).length}</span>`;
                    dropdown.appendChild(hd);
                    if (!open) return;
                    byYear.get(y).forEach(tab => {
                        const item = document.createElement('div');
                        item.className = `old-tab-item ${tab.id === state.activeTabId ? 'active' : ''}`;
                        item.dataset.tabId = tab.id;
                        item.innerHTML = `
                            <span class="old-tab-name">${getTabName(tab)}</span>
                            <span class="old-tab-close" data-tab-id="${tab.id}">✕</span>
                        `;
                        dropdown.appendChild(item);
                    });
                });

                oldTabsWrapper.appendChild(oldTabsBtn);
                container.appendChild(oldTabsWrapper);

                // 下拉選單附到 body，避免 tabs-container 的 overflow 影響 fixed 定位（iOS Safari bug）
                const oldDropdown = document.getElementById('old-tabs-dropdown');
                if (oldDropdown) oldDropdown.remove();
                document.body.appendChild(dropdown);
            }
        }

        function renderTabContent() {
            const container = document.getElementById('tab-content');
            const tab = getActiveTab();
            
            if (!tab) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">點擊「＋ 新增」建立排程</p>';
                return;
            }

            // 統計區間（使用者設定）
            const statsStart = tab.statsStartDate || tab.startDate;
            const statsEnd = tab.statsEndDate || tab.endDate;
            
            // 顯示區間（擴展到完整週）
            const displayStart = getMonday(new Date(statsStart));
            const displayEnd = getFriday(new Date(statsEnd));
            
            // 更新 tab 的顯示區間
            tab.startDate = formatDateForInput(displayStart);
            tab.endDate = formatDateForInput(displayEnd);
            
            // 計算需要幾週
            const daysDiff = (displayEnd - displayStart) / (24 * 60 * 60 * 1000);
            const weeksNeeded = Math.floor(daysDiff / 7) + 1;
            const numWeeks = Math.max(weeksNeeded, 1); // 至少 1 週

            let html = `
                <div class="tab-header">
                    <span class="tab-name-display">${getTabName(tab)}</span>
                    <div>
                        <label>統計起始：</label>
                        <input type="date" id="tab-stats-start" value="${statsStart}">
                        <label style="margin-left: 10px;">統計結束：</label>
                        <input type="date" id="tab-stats-end" value="${statsEnd}">
                    </div>
                </div>
            `;

            for (let week = 0; week < numWeeks; week++) {
                html += createWeekHTML(displayStart, week, tab);
            }

            container.innerHTML = html;
            
            // 手機版：設定週切換
            updateMobileWeekView(numWeeks);

            // 更新統計欄
            renderStatsBar();

            _lastRenderedDay = formatDateForInput(new Date());  // 記這次重畫是哪天算的 past-date（換日 watch 用）
        }

        // 換日重畫（focus 檢查 + 午夜 timer）——只在「今天」跨過上次重畫那天時才重畫，純本地零 Firebase
        function refreshIfDayChanged() {
            const today = formatDateForInput(new Date());
            if (_lastRenderedDay && today !== _lastRenderedDay) renderTabContent();
        }
        function scheduleMidnightRefresh() {
            clearTimeout(_midnightTimer);
            const now = new Date();
            const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5); // 明天 00:00:05
            _midnightTimer = setTimeout(() => { refreshIfDayChanged(); scheduleMidnightRefresh(); }, next - now);
        }
        function setupDayRolloverWatch() {
            document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshIfDayChanged(); });
            window.addEventListener('focus', refreshIfDayChanged);
            scheduleMidnightRefresh();
        }
        
        // 統計欄
        let activeStatsType = null;
        
        function renderStatsBar() {
            const tab = getActiveTab();
            if (!tab) return;
            
            // 使用統計區間（不是顯示區間）
            const statsStart = new Date(tab.statsStartDate || tab.startDate);
            const statsEnd = new Date(tab.statsEndDate || tab.endDate);
            
            // 統計各類型數量（ct-nb+ct-nb-prf 合併，stame+ctame 合併為 tame）
            const typeCounts = {
                'ct-nb': 0, 'tame': 0, 
                'sono': 0, 'mri': 0, 'arthro': 0, 'other': 0
            };
            
            // 收集所有案例
            const allCases = [];
            const validTypes = ['ct-nb', 'ct-nb-prf', 'stame', 'ctame', 'sono', 'mri', 'ct', 'arthro', 'other'];

            for (let d = new Date(statsStart); d <= statsEnd; d.setDate(d.getDate() + 1)) {
                ['AM', 'PM'].forEach(period => {
                    const cellKey = `${formatDateForInput(d)}-${period}`;
                    const cellData = state.cellData[cellKey];
                    if (cellData?.cases) {
                        const cases = Array.isArray(cellData.cases) ? cellData.cases : Object.values(cellData.cases || {});
                        cases.forEach(c => {
                            if (c && c.type && c.type !== 'slot' && !c.isEmpty && validTypes.includes(c.type)) {
                                // ct-nb-prf 合併到 ct-nb，stame/ctame 合併到 tame，ct（CT 檢查）併入 mri 桶 → 顯示 CT/MRI
                                let statsType = c.type;
                                if (c.type === 'ct-nb-prf') statsType = 'ct-nb';
                                if (c.type === 'stame' || c.type === 'ctame') statsType = 'tame';
                                if (c.type === 'ct') statsType = 'mri';
                                
                                typeCounts[statsType]++;
                                allCases.push({
                                    ...c,
                                    date: new Date(d),
                                    cellKey,
                                    period,
                                    statsType  // 用於篩選
                                });
                            }
                        });
                    }
                });
            }
            
            // 統計摘要標籤
            const statsLabels = {
                'ct-nb': 'CT NB',
                'tame': 'TAME',
                'sono': 'Sono',
                'arthro': 'Arthro',
                'other': 'Other',
                'mri': 'CT/MRI'
            };

            // 統計摘要排序（MRI 排最後）
            const statsOrder = ['ct-nb', 'tame', 'sono', 'arthro', 'other', 'mri'];
            
            // 生成統計摘要
            const summaryHTML = statsOrder
                .filter(type => typeCounts[type] > 0)
                .map(type => {
                    const count = typeCounts[type];
                    const activeClass = activeStatsType === type ? 'active' : '';
                    // tame 用 stame 的顏色（藍色）
                    const colorClass = type === 'tame' ? 'stame' : type;
                    return `<div class="stats-item ${colorClass} ${activeClass}" data-type="${type}">${statsLabels[type]}: ${count}</div>`;
                }).join('');
            
            document.getElementById('stats-summary').innerHTML = summaryHTML || '<span style="color: var(--text-muted); font-size: 0.75rem;">此區間無案例</span>';
            
            // 如果有展開的類型，顯示詳細清單
            const detailEl = document.getElementById('stats-detail');
            if (activeStatsType && typeCounts[activeStatsType] > 0) {
                const filteredCases = allCases
                    .filter(c => c.statsType === activeStatsType)
                    .sort((a, b) => {
                        const dateCompare = a.date - b.date;
                        if (dateCompare !== 0) return dateCompare;
                        if (a.period !== b.period) return a.period === 'AM' ? -1 : 1;
                        return (a.time || '').localeCompare(b.time || '');
                    });
                
                const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                const listHTML = filteredCases.map(c => {
                    const dateStr = `${String(c.date.getMonth() + 1).padStart(2, '0')}/${String(c.date.getDate()).padStart(2, '0')}`;
                    const dayName = dayNames[c.date.getDay()];
                    const statusClass = c.status === 'tentative' ? 'tentative' : '';
                    const statusText = c.status === 'tentative' ? '暫定' : '確定';
                    // Other 顯示子類型名稱
                    let typeLabel = caseTypeLabels[c.type] || c.type;
                    if (c.type === 'other' && c.otherSubtype) {
                        typeLabel = c.otherSubtype;
                    }
                    return `
                        <div class="stats-detail-item">
                            <span class="date">${dateStr} (${dayName}) ${c.period}</span>
                            <span class="time">${c.time || '--:--'}</span>
                            <span class="type-label" style="color: var(--color-ct-nb); min-width: 70px;">${escapeHtml(typeLabel)}</span>
                            <span class="chart">${escapeHtml(c.chartNo || '-')}</span>
                            <span class="status ${statusClass}">${statusText}</span>
                        </div>
                    `;
                }).join('');
                
                // 標題（tame 顯示為 TAME）
                const titleLabel = activeStatsType === 'tame' ? 'TAME' : (caseTypeLabels[activeStatsType] || activeStatsType);
                
                detailEl.innerHTML = `
                    <div class="stats-detail-title">${titleLabel} 清單（共 ${filteredCases.length} 筆）</div>
                    <div class="stats-detail-list">${listHTML}</div>
                `;
                detailEl.style.display = 'block';
            } else {
                detailEl.style.display = 'none';
            }
        }
        
        // 匯出類型名稱對應
        const exportTypeLabels = {
            'ct-nb': 'CT NB',
            'ct-nb-prf': 'pRF',
            'stame': 'sTAME',
            'ctame': 'cTAME',
            'sono': 'SONO INJ',
            'mri': 'MRI',
            'ct': 'CT',
            'arthro': 'Arthro',
            'other': 'Other'
        };
        
        // 病歷號 leading-0 變體（0XXXXXX ↔ XXXXXX）：排程與 OPD 兩邊格式常不一致，互試兩種。
        // 舊 caselist 退役後只剩匯出 docx 在用（查 opd/patients 與 patientVisitIndex）
        function recVariants(rec) {
            const list = [rec];
            if (/^0\d/.test(rec)) list.push(rec.replace(/^0+/, ''));
            else if (/^\d/.test(rec)) list.push('0' + rec);
            return list;
        }

        // 匯出 Word 文件
        async function exportToDocx() {
            const tab = getActiveTab();
            if (!tab) {
                alert('請先選擇一個分頁');
                return;
            }

            const statsStart = new Date(tab.statsStartDate || tab.startDate);
            const statsEnd = new Date(tab.statsEndDate || tab.endDate);
            const validTypes = ['ct-nb', 'ct-nb-prf', 'stame', 'ctame', 'sono', 'mri', 'ct', 'arthro', 'other'];

            // 收集所有案例
            const allCases = [];
            for (let d = new Date(statsStart); d <= statsEnd; d.setDate(d.getDate() + 1)) {
                ['AM', 'PM'].forEach(period => {
                    const cellKey = `${formatDateForInput(d)}-${period}`;
                    const cellData = state.cellData[cellKey];
                    if (!cellData?.cases) return;
                    const cases = Array.isArray(cellData.cases) ? cellData.cases : Object.values(cellData.cases || {});
                    cases.forEach(c => {
                        if (c && validTypes.includes(c.type) && !c.isEmpty) {
                            allCases.push({ ...c, date: new Date(d), period });
                        }
                    });
                });
            }
            allCases.sort((a, b) => {
                const dc = a.date - b.date;
                if (dc !== 0) return dc;
                if (a.period !== b.period) return a.period === 'AM' ? -1 : 1;
                return (a.time || '').localeCompare(b.time || '');
            });
            if (allCases.length === 0) { alert('此區間內沒有案例可匯出'); return; }

            // 顯示進度（可能要 fetch 30+ OPD reads）。舊版寫在 caselist modal 的 status 欄，
            // 該 modal 已退役 → 改用 header 常駐狀態列
            const setProgress = (t) => showStatus(t, true);
            setProgress(`匯出中：抓 OPD 資料... 0/${allCases.length}`);

            // 手寫 plan 來源：舊版讀 caselist row 的 planScratch（按病歷號配對）。
            // 舊 caselist 退役後改讀 procTrackSched overlay（按 case id 配對 —— 同一天同病人
            // 排兩台時，病歷號配對本來就會抓錯，id 配對順便修掉這個）
            let schedTrack = {};
            try { schedTrack = (await get(ref(fbDb, 'opd/procTrackSched'))).val() || {}; }
            catch (err) { console.warn('讀 procTrackSched 失敗（plan 欄改用 OPD visit）', err); }

            // 批次抓 OPD patient 主表 + 該 case 嚴格 < caseDate 的最近 prev visit
            // （取前次門診 plan = 決定 procedure 那次，含預想要做的事；不取 caseDate 當日的執行後紀錄）
            const opdPatients = {};
            const prevVisits = {};        // rec_caseDate key → {plan, date}
            const promises = [];
            allCases.forEach((c, i) => {
                const rec = (c.chartNo || '').trim();
                if (!rec) return;
                const caseDateStr = formatDateForInput(c.date);
                promises.push((async () => {
                    // 1. OPD patient（試 rec 變體）
                    if (!opdPatients[rec]) {
                        for (const v of recVariants(rec)) {
                            try {
                                const snap = await get(ref(fbDb, `opd/patients/${v}`));
                                if (snap.val()) { opdPatients[rec] = snap.val(); break; }
                            } catch {}
                        }
                    }
                    // 2. 找 ≤ caseDate 的最近一次 visit（含當日；procedure date >= visit OPD date）
                    //    先試 caseDate 當天 → 沒就找 patientVisitIndex 最近 < caseDate
                    const cacheKey = `${rec}__${caseDateStr}`;
                    if (!prevVisits[cacheKey]) {
                        let foundRec = null, foundDate = null;
                        for (const v of recVariants(rec)) {
                            try {
                                // 優先 caseDate 當天 visit
                                const exactSnap = await get(ref(fbDb, `opd/visits/${caseDateStr}/${v}`));
                                if (exactSnap.exists()) {
                                    foundRec = v;
                                    foundDate = caseDateStr;
                                    break;
                                }
                                // 否則找 ≤ caseDate 中最近
                                const idxSnap = await get(ref(fbDb, `opd/patientVisitIndex/${v}`));
                                const allDates = Object.keys(idxSnap.val() || {}).filter(d => d <= caseDateStr).sort();
                                if (allDates.length > 0) {
                                    foundRec = v;
                                    foundDate = allDates[allDates.length - 1];
                                    break;
                                }
                            } catch {}
                        }
                        if (foundRec && foundDate) {
                            try {
                                const vs = await get(ref(fbDb, `opd/visits/${foundDate}/${foundRec}`));
                                const v = vs.val();
                                if (v) prevVisits[cacheKey] = { date: foundDate, plan: v.plan || '' };
                            } catch {}
                        }
                    }
                    setProgress(`匯出中：抓 OPD 資料... ${i + 1}/${allCases.length}`);
                })());
            });
            await Promise.all(promises);

            // 計算 ageSex
            const getAgeSex = (c) => {
                const rec = (c.chartNo || '').trim();
                const p = opdPatients[rec];
                if (p) {
                    if (p.birthYear) return `${c.date.getFullYear() - p.birthYear}/${p.sex || ''}`;
                    if (p.ageSex) return p.ageSex;
                }
                return '';
            };

            // 萃取 eGFR：先 patient.eGFR；否則從 patient.labs 解析（找 "eGFR" 數字）
            const getEgfr = (rec) => {
                const p = opdPatients[rec];
                if (!p) return '';
                if (p.eGFR) return String(p.eGFR).trim();
                if (p.labs) {
                    const m = p.labs.match(/eGFR[:：]?\s*([><]?\s*\d+(?:\.\d+)?)/i);
                    if (m) return m[1].trim();
                }
                return '';
            };

            // 組 col 4 額外資訊（簡化：只放抗凝藥 + INR + 來源）
            const getExtraLines = (rec) => {
                const p = opdPatients[rec];
                if (!p) return [];
                const lines = [];
                if (p.anticoagState === 'yes' && p.anticoagulants?.length) {
                    lines.push(`🩸 ${p.anticoagulants.join(' / ')}`);
                }
                if (p.labs) {
                    // 抓最完整的 INR（含日期）：INR: 1.02 (26/04) 之類
                    const m = p.labs.match(/INR[:：]?\s*(\d+(?:\.\d+)?(?:\s*\([^)]*\))?)/i);
                    if (m) lines.push(`INR: ${m[1]}`);
                }
                if (p.referrer) lines.push(p.referrer);
                return lines;
            };

            // 智慧抽取 plan 段落：依 case type 篩
            //   procedure: [當日 RTC 行] + [procedure detail 行] + [下次 RTC 行]
            //   mri/arthro: 含 MRI/MR/arthro keyword 的行
            //   other: 前 5 行
            function extractPlanForCase(planText, caseDate, caseType) {
                if (!planText) return [];
                const lines = planText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                // mri / arthro：只抓含 keyword 的行
                if (caseType === 'mri' || caseType === 'arthro') {
                    const kw = caseType === 'mri' ? /\b(MRI|MR(?!\s*A))\b/i : /\b(arthro|MRA|joint)\b/i;
                    return lines.filter(l => kw.test(l)).slice(0, 5);
                }
                if (caseType === 'other') return lines.slice(0, 5);
                // procedure：找 thisRTC + nextRTC + 之間 detail
                const cm = caseDate.getMonth() + 1;
                const cd = caseDate.getDate();
                const caseDateYMD = formatDateForInput(caseDate);
                let thisRTCIdx = -1, nextRTCIdx = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (!/\bRTC\b/i.test(lines[i])) continue;
                    const dm = lines[i].match(/(?:\d{2}\/)?(\d{1,2})\/(\d{1,2})/);
                    if (!dm) continue;
                    const m = parseInt(dm[1], 10), d = parseInt(dm[2], 10);
                    if (m === cm && d === cd && thisRTCIdx < 0) thisRTCIdx = i;
                    else {
                        const yy = caseDate.getFullYear();
                        const lineDate = `${yy}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        if (lineDate > caseDateYMD && nextRTCIdx < 0) nextRTCIdx = i;
                    }
                }
                // 決定 detail 範圍
                let detailStart, detailEnd;
                if (thisRTCIdx >= 0 && nextRTCIdx > thisRTCIdx) {
                    detailStart = thisRTCIdx + 1;
                    detailEnd = nextRTCIdx;
                } else if (thisRTCIdx >= 0) {
                    detailStart = thisRTCIdx + 1;
                    detailEnd = Math.min(lines.length, thisRTCIdx + 5);
                } else if (nextRTCIdx >= 0) {
                    detailStart = Math.max(0, nextRTCIdx - 4);
                    detailEnd = nextRTCIdx;
                } else {
                    detailStart = 0;
                    detailEnd = Math.min(lines.length, 5);
                }
                const result = [];
                if (thisRTCIdx >= 0) result.push(lines[thisRTCIdx]);
                for (let i = detailStart; i < detailEnd; i++) {
                    if (i === thisRTCIdx || i === nextRTCIdx) continue;
                    result.push(lines[i]);
                }
                if (nextRTCIdx > thisRTCIdx) result.push(lines[nextRTCIdx]);
                return result;
            }

            // 組 col 6 plan：procTrackSched.planScratch（手寫）> OPD ≤ caseDate 最近 visit plan
            const getPlanLines = (c) => {
                const rec = (c.chartNo || '').trim();
                const ps = c.id ? (schedTrack[c.id]?.planScratch || '').trim() : '';
                let raw = '';
                if (ps) {
                    raw = ps;
                } else {
                    const cacheKey = `${rec}__${formatDateForInput(c.date)}`;
                    raw = prevVisits[cacheKey]?.plan || '';
                }
                return extractPlanForCase(raw, c.date, c.type);
            };

            // === 建表 ===
            const { Document, Packer, Table, TableRow, TableCell, Paragraph, TextRun, WidthType, BorderStyle, ShadingType } = docx;
            const border = { style: BorderStyle.SINGLE, size: 1, color: "000000" };
            const borders = { top: border, bottom: border, left: border, right: border };
            // 6 欄寬：病歷號(姓) / 年齡性別 / eGFR / 額外 / 日期時間+procedure / Plan
            const colWidths = [1100, 700, 600, 2100, 1500, 3360];   // 總 9360

            // Header row
            const headerCell = (text, w) => new TableCell({
                borders,
                width: { size: w, type: WidthType.DXA },
                shading: { fill: "E5E7EB", type: ShadingType.CLEAR },
                children: [new Paragraph({ children: [new TextRun({ text, size: 20, bold: true })] })]
            });
            const headerRow = new TableRow({
                tableHeader: true,
                children: [
                    headerCell('病歷號 (姓)', colWidths[0]),
                    headerCell('年齡/性別', colWidths[1]),
                    headerCell('eGFR', colWidths[2]),
                    headerCell('額外', colWidths[3]),
                    headerCell('日期/時間/Procedure', colWidths[4]),
                    headerCell('Plan', colWidths[5])
                ]
            });

            const mkLineP = (text, opts = {}) => new Paragraph({
                children: [new TextRun({ text, size: opts.size || 20, bold: !!opts.bold, color: opts.color })],
                spacing: { before: 0, after: 0 }
            });

            const tableRows = [headerRow, ...allCases.map(c => {
                const rec = (c.chartNo || '').trim();
                const p = opdPatients[rec];
                const surname = p?.surname ? String(p.surname).replace(/\s+/g, '') : '';
                const col1 = surname ? `${rec} (${surname})` : rec;
                const col2 = getAgeSex(c);
                const col3 = getEgfr(rec);
                const col4Lines = getExtraLines(rec);
                const dateStr = `${String(c.date.getMonth() + 1).padStart(2, '0')}/${String(c.date.getDate()).padStart(2, '0')}`;
                let typeLabel = exportTypeLabels[c.type] || c.type;
                if (c.type === 'other' && c.otherSubtype) typeLabel = c.otherSubtype;
                const col5Text = `${dateStr} ${c.time || ''} ${typeLabel}`.trim();
                const col6Lines = getPlanLines(c);

                // 顏色：第 5 欄（procedure）依類型上色
                let col5Shading = null;
                if (c.type === 'mri') col5Shading = { fill: "E6E6FA", type: ShadingType.CLEAR };
                else if (c.type === 'arthro') col5Shading = { fill: "FFFACD", type: ShadingType.CLEAR };

                const col5CellSpec = {
                    borders,
                    width: { size: colWidths[4], type: WidthType.DXA },
                    children: [new Paragraph({ children: [new TextRun({ text: col5Text, size: 22, bold: true })] })]
                };
                if (col5Shading) col5CellSpec.shading = col5Shading;

                return new TableRow({
                    children: [
                        new TableCell({
                            borders,
                            width: { size: colWidths[0], type: WidthType.DXA },
                            children: [new Paragraph({ children: [new TextRun({ text: col1, size: 22, bold: true })] })]
                        }),
                        new TableCell({
                            borders,
                            width: { size: colWidths[1], type: WidthType.DXA },
                            children: [new Paragraph({ children: [new TextRun({ text: col2, size: 22 })] })]
                        }),
                        new TableCell({
                            borders,
                            width: { size: colWidths[2], type: WidthType.DXA },
                            children: [new Paragraph({ children: [new TextRun({ text: col3, size: 22 })] })]
                        }),
                        new TableCell({
                            borders,
                            width: { size: colWidths[3], type: WidthType.DXA },
                            children: col4Lines.length ? col4Lines.map(l => mkLineP(l, { size: 18 })) : [new Paragraph({ children: [] })]
                        }),
                        new TableCell(col5CellSpec),
                        new TableCell({
                            borders,
                            width: { size: colWidths[5], type: WidthType.DXA },
                            children: col6Lines.length ? col6Lines.map(l => mkLineP(l, { size: 18 })) : [new Paragraph({ children: [] })]
                        })
                    ]
                });
            })];

            setProgress(`✓ 匯出完成（${allCases.length} 筆）`);
            
            const table = new Table({
                width: { size: 9360, type: WidthType.DXA },
                columnWidths: colWidths,
                rows: tableRows
            });
            
            // 建立文件
            const doc = new Document({
                styles: {
                    default: {
                        document: {
                            run: { font: "Arial", size: 22 }
                        }
                    }
                },
                sections: [{
                    properties: {
                        page: {
                            size: { width: 12240, height: 15840 },
                            margin: { top: 720, right: 720, bottom: 720, left: 720 }
                        }
                    },
                    children: [table]
                }]
            });
            
            // 生成並下載
            const buffer = await Packer.toBlob(doc);
            const url = URL.createObjectURL(buffer);
            const a = document.createElement('a');
            const tabName = getTabName(tab).replace(/\//g, '-');
            const dateRange = `${formatDateForInput(statsStart).slice(5).replace('-','')}-${formatDateForInput(statsEnd).slice(5).replace('-','')}`;
            a.href = url;
            a.download = `Procedure_list_${tabName}_${dateRange}.docx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // 手機版週切換
        function updateMobileWeekView(totalWeeks) {
            const isMobile = window.innerWidth <= 768;
            if (!isMobile) return;
            
            const weekContainers = document.querySelectorAll('.week-container');
            const indicator = document.getElementById('week-indicator');
            const prevBtn = document.getElementById('prev-week-btn');
            const nextBtn = document.getElementById('next-week-btn');
            
            if (!weekContainers.length) return;
            
            // 確保 index 在範圍內
            if (state.mobileWeekIndex >= totalWeeks) state.mobileWeekIndex = 0;
            if (state.mobileWeekIndex < 0) state.mobileWeekIndex = totalWeeks - 1;
            
            // 顯示當前週
            weekContainers.forEach((el, i) => {
                el.classList.toggle('mobile-active', i === state.mobileWeekIndex);
            });
            
            // 更新指示器
            if (indicator) {
                indicator.textContent = `第 ${state.mobileWeekIndex + 1} / ${totalWeeks} 週`;
            }
            
            // 更新按鈕狀態
            if (prevBtn) prevBtn.disabled = state.mobileWeekIndex === 0;
            if (nextBtn) nextBtn.disabled = state.mobileWeekIndex === totalWeeks - 1;
        }

        function createWeekHTML(startDate, weekIndex, tab) {
            const weekStart = new Date(startDate);
            weekStart.setDate(weekStart.getDate() + weekIndex * 7);
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekEnd.getDate() + 4);

            return `
                <div class="week-container">
                    <div class="week-header">
                        <span class="week-title">第 ${weekIndex + 1} 週</span>
                        <span class="week-dates">${formatDateMD(weekStart)} - ${formatDateMD(weekEnd)}</span>
                    </div>
                    <div class="schedule-grid">
                        <div class="grid-header"></div>
                        ${[0,1,2,3,4].map(d => {
                            const date = new Date(weekStart);
                            date.setDate(date.getDate() + d);
                            const dayOfWeek = date.getDay();
                            const dayNameMap = ['日', '一', '二', '三', '四', '五', '六'];
                            return `<div class="grid-header day-header"><span class="day-name">週${dayNameMap[dayOfWeek]}</span><span class="day-date">${formatDateMD(date)}</span></div>`;
                        }).join('')}
                        ${(() => {
                            const satDate = new Date(weekStart);
                            satDate.setDate(satDate.getDate() + 5);
                            return `<div class="grid-header day-header saturday"><span class="day-name">週六</span><span class="day-date">${formatDateMD(satDate)}</span></div>`;
                        })()}
                        <div class="row-label am">AM</div>
                        ${[0,1,2,3,4].map(d => createCellHTML(weekStart, d, 'AM', tab)).join('')}
                        ${createSaturdayCell(weekStart, 'AM')}
                        <div class="row-label pm">PM</div>
                        ${[0,1,2,3,4].map(d => createCellHTML(weekStart, d, 'PM', tab)).join('')}
                        ${createSaturdayCell(weekStart, 'PM')}
                    </div>
                </div>
            `;
        }

        function createCellHTML(weekStart, dayOffset, period, tab) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + dayOffset);
            const cellKey = `${formatDateForInput(date)}-${period}`;
            const cellData = state.cellData[cellKey] || { blocked: false, blockedReason: '', cases: [] };
            
            // 確保 cases 是陣列（Firebase 可能存成物件）
            const cases = Array.isArray(cellData.cases) ? cellData.cases : Object.values(cellData.cases || {});

            // 只保留真正的案例（過濾掉空位）
            const realCases = cases.filter(c => c && c.type !== 'slot' && !c.isEmpty);
            
            // 判斷整格是否只有影像類（MRI / CT）→ 可佔整格；混到其他 procedure 時影像類縮半寬靠右
            const onlyImaging = realCases.length > 0 && realCases.every(c => c.type === 'mri' || c.type === 'ct');

            const displayCases = [...realCases];

            // 加入足夠的空位
            const minSlots = Math.max(DEFAULT_SLOTS_PER_CELL, realCases.length + 1);
            while (displayCases.length < minSlots) {
                displayCases.push({ type: 'slot', time: '', chartNo: '', status: 'tentative', isEmpty: true });
            }

            const casesHTML = displayCases.map((c, i) => createCaseTagHTML(c, cellKey, i, onlyImaging)).join('');
            const blockedClass = cellData.blocked ? 'blocked' : '';
            const blockedNote = cellData.blocked && cellData.blockedReason ? `<div class="blocked-note">${escapeHtml(cellData.blockedReason)}</div>` : '';
            
            // 判斷是否為過去的日期
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const cellDate = new Date(date);
            cellDate.setHours(0, 0, 0, 0);
            const pastClass = cellDate < today ? 'past-date' : '';

            return `
                <div class="cell ${blockedClass} ${pastClass}" data-cell-key="${cellKey}">
                    ${blockedNote}
                    <div class="cases">${casesHTML}</div>
                </div>
            `;
        }

        // 週六專用格子（只顯示 MRI）
        function createSaturdayCell(weekStart, period) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + 5); // 週六
            const cellKey = `${formatDateForInput(date)}-${period}`;
            const cellData = state.cellData[cellKey] || { blocked: false, blockedReason: '', cases: [] };
            
            // 確保 cases 是陣列
            const cases = Array.isArray(cellData.cases) ? cellData.cases : Object.values(cellData.cases || {});

            // 週六只顯示 MRI 類型的案例（過濾掉空位）
            // 週六顯示影像類（MRI + CT）；CT 拖進週六不再隱形
            const mriCases = cases.filter(c => c && (c.type === 'mri' || c.type === 'ct') && !c.isEmpty);
            
            // 加一個空位
            const displayCases = [...mriCases, { type: 'slot', isEmpty: true }];

            const casesHTML = displayCases.map((c, i) => createSaturdayCaseTag(c, cellKey, i)).join('');
            
            // 判斷是否為過去的日期
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const cellDate = new Date(date);
            cellDate.setHours(0, 0, 0, 0);
            const pastClass = cellDate < today ? 'past-date' : '';

            return `
                <div class="cell saturday-cell ${pastClass}" data-cell-key="${cellKey}" data-saturday="true">
                    <div class="cases">${casesHTML}</div>
                </div>
            `;
        }

        function createSaturdayCaseTag(caseData, cellKey, index) {
            const isEmpty = caseData.isEmpty || caseData.type === 'slot';
            
            if (isEmpty) {
                return `<div class="case-tag slot saturday-slot" data-cell-key="${cellKey}" data-index="${index}" data-is-empty="true" data-saturday="true">＋</div>`;
            }
            
            const time = caseData.time || '';
            const tentativeClass = caseData.status === 'tentative' ? 'tentative' : '';
            // 週六 MRI 點擊整個標籤來編輯，不用小按鈕
            return `
                <div class="case-tag ${caseData.type} saturday-mri ${tentativeClass}" data-cell-key="${cellKey}" data-index="${index}" data-is-empty="false" data-saturday="true" style="cursor: pointer;">
                    <span style="font-size: 0.55rem;">${escapeHtml(time)}</span>
                </div>
            `;
        }

        function createCaseTagHTML(caseData, cellKey, index, onlyImaging = false) {
            const isEmpty = caseData.isEmpty || caseData.type === 'slot';
            // Other 類型顯示子類型名稱
            let typeLabel = caseTypeLabels[caseData.type] || caseData.type;
            if (caseData.type === 'other' && caseData.otherSubtype) {
                typeLabel = caseData.otherSubtype;
            }
            const tentativeClass = caseData.status === 'tentative' ? 'tentative' : '';
            const typeClass = isEmpty ? 'slot' : caseData.type;
            
            // 影像類（MRI / CT）：整格只有影像類時佔整格，否則維持半寬靠右
            const fullWidthClass = ((caseData.type === 'mri' || caseData.type === 'ct') && onlyImaging) ? 'full-width' : '';

            let displayText = '';
            let mobileText = '';
            if (!isEmpty) {
                if (caseData.type === 'note') {
                    // 備註有填時間就把時間擺前面（09:00 前晚值班）
                    const noteParts = [caseData.time, caseData.note].filter(Boolean);
                    displayText = noteParts.join(' ');
                    mobileText = noteParts.join('\n');
                } else {
                    // 電腦版：一行顯示
                    const parts = [caseData.time, typeLabel, caseData.chartNo].filter(Boolean);
                    displayText = parts.join(' ');
                    // 手機版：換行顯示
                    mobileText = parts.join('\n');
                }
            }

            const actionsHTML = isEmpty ? '' : `
                <div class="case-actions">
                    <button class="case-action-btn edit-btn" title="編輯">✎</button>
                    <button class="case-action-btn delete-btn" title="刪除">✕</button>
                </div>
            `;

            // 領藥狀態左條（非空、非 note 才有）：一般 → 未領 → 已領 循環
            const showMed = !isEmpty && caseData.type !== 'note';
            const medState = caseData.medState === 'pending' ? 'med-pending'
                           : caseData.medState === 'collected' ? 'med-collected' : '';
            const medLabel = caseData.medState === 'pending' ? '未領藥'
                           : caseData.medState === 'collected' ? '已領藥' : '一般（點擊標記領藥）';
            const medStripHTML = showMed
                ? `<div class="med-strip ${medState}" title="領藥：${medLabel}（點擊循環）"></div>` : '';

            return `
                <div class="case-tag ${typeClass} ${tentativeClass} ${fullWidthClass} ${showMed ? 'has-med' : ''}"
                     draggable="${!isEmpty}"
                     data-cell-key="${cellKey}"
                     data-index="${index}"
                     data-is-empty="${isEmpty}">
                    ${medStripHTML}
                    <div class="case-info">
                        <span class="case-detail" data-mobile="${escapeHtml(mobileText)}">${isEmpty ? '＋' : escapeHtml(displayText)}</span>
                    </div>
                    ${actionsHTML}
                </div>
            `;
        }

        function getDefaultTime(type, cellKey) {
            const isAM = cellKey.endsWith('-AM');
            if (type === 'ct-nb' || type === 'ct-nb-prf') return isAM ? '10:00' : '15:00';
            if (type === 'stame' || type === 'ctame') return '08:00';
            if (type === 'arthro') return '08:30';
            return '';
        }

        // 時間輸入自動補冒號：1300 → 13:00, 900 → 09:00
        function formatTimeInput(input) {
            if (!input) return '';
            
            // 如果已經有冒號，直接返回
            if (input.includes(':')) return input;
            
            // 移除非數字
            const digits = input.replace(/\D/g, '');
            
            if (digits.length === 0) return '';
            
            if (digits.length <= 2) {
                // 9 → 09:00, 13 → 13:00
                return digits.padStart(2, '0') + ':00';
            } else if (digits.length === 3) {
                // 900 → 09:00, 130 → 01:30
                return '0' + digits[0] + ':' + digits.slice(1);
            } else {
                // 1300 → 13:00, 0900 → 09:00
                return digits.slice(0, 2) + ':' + digits.slice(2, 4);
            }
        }

        // ========== 🗂 Procedure 清單（proclist-core.js 掛載） ==========
        // 排程頁沒有 OPD 的 visits/patients cache → 不注入 getAllVisits/getPatients，模組自建 TTL 5min cache
        let procListInst = null;
        const PROC_LIVE_KEY = 'sched:procLiveSync';
        function updateProcLiveBtn(on) {
            const btn = document.getElementById('proc-live-btn');
            if (!btn) return;
            btn.textContent = on ? '⚡ 即時同步中' : '⚡ 即時同步';
            btn.classList.toggle('active', on);
        }
        function openProcPanel() {
            document.getElementById('proc-overlay').style.display = 'block';
            if (!procListInst) {
                procListInst = createProcList({
                    fb: { db: fbDb, ref, get, update, onValue },
                    jumpToVisit: (date, rec) => window.open(`opd.html?date=${encodeURIComponent(date)}&rec=${encodeURIComponent(rec)}`, '_blank'),
                    reportError: (err, label) => alert(`${label} 寫入失敗：${err?.message || err}`)
                });
                procListInst.bind();
                document.getElementById('proc-live-btn')?.addEventListener('click', () => {
                    const on = procListInst.setLiveSync(!procListInst.isLive());
                    localStorage.setItem(PROC_LIVE_KEY, on ? '1' : '0');
                    updateProcLiveBtn(on);
                });
                if (localStorage.getItem(PROC_LIVE_KEY) === '1') updateProcLiveBtn(procListInst.setLiveSync(true));
            }
            procListInst.invalidateSched();  // 開面板強制刷新排程快取
            procListInst.render({ scroll: true });  // 開 overlay 捲到今天
        }

        // Event Listeners
        function setupEventListeners() {
            // 匯出按鈕
            document.getElementById('export-btn')?.addEventListener('click', exportToDocx);
            document.getElementById('proc-btn')?.addEventListener('click', openProcPanel);
